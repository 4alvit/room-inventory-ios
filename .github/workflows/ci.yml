name: iOS validation
on:
  workflow_call:
permissions:
  contents: read
jobs:
  source-identity:
    name: Source identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      tree: ${{ steps.identity.outputs.tree }}
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Record immutable source identity
        id: identity
        run: |
          python3 - <<'PY_IDENTITY'
          import os, re, subprocess
          expected = os.environ["GITHUB_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", expected):
              raise SystemExit("Invalid event commit")
          values = subprocess.check_output(
              ["git", "--no-replace-objects", "rev-parse", "HEAD", "HEAD^{tree}"], text=True).splitlines()
          if len(values) != 2 or any(not re.fullmatch(r"[0-9a-f]{40}", value) for value in values):
              raise SystemExit("Invalid source identity")
          commit, tree = values
          if commit != expected:
              raise SystemExit("Checkout differs from event commit")
          if subprocess.check_output(
                  ["git", "status", "--porcelain", "--untracked-files=all"], text=True).strip():
              raise SystemExit("Source identity requires a clean checkout")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"commit={commit}\ntree={tree}\n")
          PY_IDENTITY

  ios:
    name: Core and iOS tests
    needs: source-identity
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      SIMULATOR_RUNTIME_VERSION: '26.2'
      SIMULATOR_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.iPhone-16e
      EXPECTED_SOURCE_COMMIT: ${{ needs.source-identity.outputs.commit }}
      EXPECTED_SOURCE_TREE: ${{ needs.source-identity.outputs.tree }}
    outputs:
      version: ${{ steps.preview-version.outputs.version }}
      tested-commit: ${{ steps.preview-version.outputs.commit }}
      tested-tree: ${{ steps.preview-version.outputs.tree }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify shared source identity before tests
        run: |
          python3 - <<'PY_SOURCE'
          import os, re, subprocess
          expected = [os.environ["EXPECTED_SOURCE_COMMIT"], os.environ["EXPECTED_SOURCE_TREE"]]
          if any(not re.fullmatch(r"[0-9a-f]{40}", value) for value in expected):
              raise SystemExit("Invalid shared source identity")
          actual = subprocess.check_output(
              ["git", "--no-replace-objects", "rev-parse", "HEAD", "HEAD^{tree}"], text=True).splitlines()
          if actual != expected or expected[0] != os.environ["GITHUB_SHA"]:
              raise SystemExit("Core checkout differs from shared source identity")
          if subprocess.check_output(
                  ["git", "status", "--porcelain", "--untracked-files=all"], text=True).strip():
              raise SystemExit("Core tests require a clean checkout")
          PY_SOURCE
      - name: Install locked workflow validation dependency
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r .github/requirements-workflow-contracts.txt
      - name: Set up qualified Go for downloader regression tests
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Test bounded release CLI download retries
        timeout-minutes: 3
        env:
          GOTOOLCHAIN: local
          GO111MODULE: 'off'
          GOWORK: 'off'
          GOENV: 'off'
          CGO_ENABLED: '0'
          GODEBUG: fips140=on
          GOMAXPROCS: '2'
          GOFLAGS: -p=2
        run: go test -count=1 -timeout=60s scripts/download_release_gh.go scripts/download_release_gh_test.go
      - name: Verify installed ARM toolchain
        run: |
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = arm64
          test "$ImageOS" = macos26
          xcode_version="$(xcodebuild -version)"
          printf '%s\n' "$RUNNER_ARCH" "$ImageOS" "$ImageVersion" "$DEVELOPER_DIR" "$xcode_version"
          test "$xcode_version" = $'Xcode 26.4.1\nBuild version 17E202'
          swift --version
          xcrun simctl list runtimes
      - name: Run source contracts, Core tests, Simulator build and app tests
        run: bash scripts/ci.sh
      - name: Record validated source and preview version
        id: preview-version
        run: |
          python3 - <<'PY_VERSION'
          import os, pathlib, re, subprocess
          if subprocess.check_output(["git", "status", "--porcelain", "--untracked-files=all"], text=True).strip():
              raise SystemExit("Validated source must remain clean")
          version = pathlib.Path("VERSION").read_text().strip()
          if not re.fullmatch(r"(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)", version):
              raise SystemExit("Invalid committed preview version")
          expected = [os.environ["EXPECTED_SOURCE_COMMIT"], os.environ["EXPECTED_SOURCE_TREE"]]
          if any(not re.fullmatch(r"[0-9a-f]{40}", value) for value in expected):
              raise SystemExit("Invalid shared source identity")
          actual = subprocess.check_output(
              ["git", "--no-replace-objects", "rev-parse", "HEAD", "HEAD^{tree}"], text=True).splitlines()
          if actual != expected or expected[0] != os.environ["GITHUB_SHA"]:
              raise SystemExit("Validated source differs from shared source identity")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\ncommit={actual[0]}\ntree={actual[1]}\n")
          PY_VERSION
      - name: Preserve Simulator test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simulator-test-results-${{ github.run_attempt }}
          path: .build/*.xcresult
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  recovery:
    name: Recovery journey
    needs: source-identity
    runs-on: xcode-27
    timeout-minutes: 48
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      RECOVERY_TESTED_COMMIT: ${{ needs.source-identity.outputs.commit }}
      RECOVERY_TESTED_TREE: ${{ needs.source-identity.outputs.tree }}
    steps:
      - name: Checkout validated event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Run one bounded hosted recovery journey
        id: recovery
        timeout-minutes: 39
        run: python3 scripts/recovery_hosted.py --profile-sha256 4289c2732781da59c963a8a377198f339fafe0e2beb41509f0018b545f6858d2
      - name: Preserve small recovery failure diagnostic
        if: ${{ always() && steps.recovery.outcome != 'success' }}
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recovery-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/room-recovery-diagnostic/
          include-hidden-files: false
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
      - name: Preserve compact recovery evidence
        if: ${{ always() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recovery-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/room-recovery-upload/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  preview:
    name: PR Simulator candidate
    needs: [ios, recovery]
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ needs.ios.outputs.version }}
      channel: beta
      source-ref: ${{ github.event.pull_request.head.sha }}
      tested-commit: ${{ needs.ios.outputs.tested-commit }}
      tested-tree: ${{ needs.ios.outputs.tested-tree }}

  harness-build:
    name: Compile the standalone RC runner
    if: github.event_name == 'pull_request'
    runs-on: xcode-27
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate RC acceptance provenance and failure fixtures
        run: python3 scripts/tests/test_rc_acceptance.py
      - name: Check the actual RC backup selection on the host
        timeout-minutes: 4
        run: python3 scripts/test-rc-backup-selection.py --output "$RUNNER_TEMP/rc-backup-selection"
      - name: Build runner and validate installed-artifact specification only
        run: |
          python3 scripts/rc_acceptance.py --build-only --harness-sha "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/rc-harness-build"
      - name: Preserve compile and shape evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rc-harness-build-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/rc-harness-build/*.json
            ${{ runner.temp }}/rc-harness-build/*.xctestrun
            ${{ runner.temp }}/rc-harness-build/operations
            ${{ runner.temp }}/rc-backup-selection/*.json
            ${{ runner.temp }}/rc-backup-selection/*.stdout
            ${{ runner.temp }}/rc-backup-selection/*.stderr
