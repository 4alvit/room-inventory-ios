name: Room CSV observation (not acceptance)
run-name: Room CSV one observation at 060c24a
on:
  push:
    branches: [diagnostics/room-csv-060c24a-20261030]
permissions:
  contents: read
concurrency:
  group: room-csv-once-060c24a
  cancel-in-progress: false
jobs:
  observe:
    if: github.run_attempt == 1 && github.event.created == true && github.event.before == '0000000000000000000000000000000000000000'
    runs-on: macos-15
    timeout-minutes: 22
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Checkout observation code
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: observer
      - name: Checkout immutable application source
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 060c24a995239c7ea2a82bb03969227da4997c59
          path: source
      - name: Run one bounded observation
        id: observation
        timeout-minutes: 18
        run: python3 observer/.diagnostics/probe_room_csv.py "$GITHUB_WORKSPACE/source"
      - name: Retain only bounded evidence
        timeout-minutes: 1
        if: always() && steps.observation.outputs.evidence_ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: room-csv-observation-${{ github.run_id }}-1-060c24a
          path: ${{ steps.observation.outputs.evidence }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
