name: Build unsigned Simulator preview
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      channel:
        required: true
        type: string
      source-ref:
        description: Expected immutable PR head SHA for provenance; never selects a checkout
        required: false
        type: string
        default: ''
      tested-commit:
        description: Commit validated by the PR iOS job
        required: false
        type: string
        default: ''
      tested-tree:
        description: Tree validated by the PR iOS job
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  package:
    name: Source and Simulator preview
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      PREVIEW_SOURCE_REF: ${{ inputs.source-ref }}
      PREVIEW_TESTED_COMMIT: ${{ inputs.tested-commit }}
      PREVIEW_TESTED_TREE: ${{ inputs.tested-tree }}
    steps:
      - name: Checkout release event revision
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Checkout immutable PR head
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify installed ARM toolchain
        run: |
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = arm64
          test "$ImageOS" = macos27
          xcode_version="$(xcodebuild -version)"
          printf '%s\n' "$RUNNER_ARCH" "$ImageOS" "$ImageVersion" "$DEVELOPER_DIR" "$xcode_version"
          test "$xcode_version" = $'Xcode 27.1\nBuild version 27A9275'
      - name: Verify checkout provenance
        run: python3 scripts/preview-provenance.py check
      - name: Build committed preview assets
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: bash scripts/package-release.sh "$RELEASE_VERSION" "$RELEASE_CHANNEL"
      - name: Bind candidate artifacts to checkout and run
        run: python3 scripts/preview-provenance.py record
      - name: Verify payload hashes
        working-directory: release-dist
        run: shasum -a 256 -c SHA256SUMS
      - name: Preserve candidate artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.event_name == 'pull_request' && format('pr-simulator-{0}-{1}-{2}', github.event.pull_request.number, github.event.pull_request.head.sha, github.run_attempt) || 'release-assets-simulator' }}
          path: release-dist/*
          if-no-files-found: error
          retention-days: 30
