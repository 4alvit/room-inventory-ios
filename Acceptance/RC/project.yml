name: RoomInventoryRCAcceptance
options:
  bundleIdPrefix: com.alvit.roominventory
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  RoomInventoryRCAcceptanceTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - RCArtifactAcceptanceTests.swift
      - ../../UITests/Support/AutofocusedNameEntry.swift
      - ../../UITests/Support/NameEntryKeyboardReadiness.swift
      - ../../UITests/Support/RecoveryOCRReadinessWindow.swift
      - ../../UITests/Support/FilesNavigationReadiness.swift
      - ../../UITests/Support/ExportReturnReadiness.swift
    # No app target, application dependency or reconstructed RC build.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alvit.roominventory.rcacceptance
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ''
schemes:
  RCAcceptance:
    build:
      targets:
        RoomInventoryRCAcceptanceTests: [test]
    test:
      config: Release
      targets:
        - RoomInventoryRCAcceptanceTests
